<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D ASCII Renderer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
  </style>

  <!-- Three.js 및 관련 모듈 불러오기 (Import Map 사용) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene, Camera 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0, 0, 0);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 150, 400);

    // 2. 조명 추가 (아스키 입체감을 위해 필수)
    const pointLight1 = new THREE.PointLight(0xffffff, 3, 0, 0);
    pointLight1.position.set(500, 500, 500);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xffffff, 1, 0, 0);
    pointLight2.position.set(-500, -500, -500);
    scene.add(pointLight2);

    // 3. 3D 입체 모형 생성 (삼각뿔)
    // ConeGeometry(반지름, 높이, 밑면 분할 수) -> 분할 수를 3으로 지정하면 삼각뿔이 됩니다.
    const geometry = new THREE.BoxGeometry(200, 200, 200);


    const material = new THREE.MeshPhongMaterial({ flatShading: true });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 4. WebGL 렌더러 생성
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);

    // 5. ASCII 이펙트 적용
    // 사용될 문자셋: 어두운 문자부터 밝은 문자 순서
    // const charSet = ' .:-=+*#%@'; 
    const charSet = ' .·:+*#%▒▓█'; 
    const effect = new AsciiEffect(renderer, charSet, { invert: true });
    effect.setSize(window.innerWidth, window.innerHeight);
    
    effect.domElement.style.color = '#FFFF00';
    effect.domElement.style.backgroundColor = '#0000AA';
    document.body.appendChild(effect.domElement);

    // 6. 마우스 드래그 조작 (OrbitControls)
    const controls = new OrbitControls(camera, effect.domElement);
    controls.enableDamping = true;

    // 7. 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);

      // 자동 회전
      mesh.rotation.x += 0.005;
      mesh.rotation.y += 0.01;

      controls.update();
      effect.render(scene, camera);
    }

    animate();

    // 8. 창 크기 변경 대응
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      effect.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

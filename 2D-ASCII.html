<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D ASCII Renderer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
  </style>

  <!-- Three.js 및 관련 모듈 불러오기 (Import Map 사용) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

    // 1. Scene, Camera 설정 (순수 2D 정면 뷰)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0, 0, 0);

    // 카메라를 비스듬한 각도가 아닌 화면 정면(Z축)에 수직으로 배치하여 3D 왜곡 없는 2D 평면을 구성합니다.
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 0, 400);

    // 2. 조명 설정 (2D 도형 표면에서 문자셋 ' .·:+*#%▒▓█'의 다채로운 농도가 표현되도록 전면 배치)
    const pointLight1 = new THREE.PointLight(0xffffff, 3, 0, 0);
    pointLight1.position.set(250, 250, 400);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xffffff, 1.5, 0, 0);
    pointLight2.position.set(-250, -250, 400);
    scene.add(pointLight2);

    // 3. 2D 도형 생성 (정삼각형)
    // CircleGeometry(반지름, 분할수 3, 시작 각도) -> 꼭짓점이 위를 향하는 정삼각형
    const geometry = new THREE.CircleGeometry(160, 3, Math.PI / 2);
    const material = new THREE.MeshPhongMaterial({ flatShading: true });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 4. WebGL 렌더러 생성
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);

    // 5. ASCII 이펙트 적용 (기존 배경색 및 글자색 유지)
    const charSet = ' .·:+*#%▒▓█'; 
    const effect = new AsciiEffect(renderer, charSet, { invert: true });
    effect.setSize(window.innerWidth, window.innerHeight);
    
    effect.domElement.style.color = '#FFFF00';
    effect.domElement.style.backgroundColor = '#0000AA';
    document.body.appendChild(effect.domElement);

    // 6. 애니메이션 루프 (순수 2D 평면 회전)
    function animate() {
      requestAnimationFrame(animate);

      // X, Y축 회전(3D 덤블링)을 없애고 화면 평면과 나란한 Z축만 회전시켜 순수한 2D 회전을 구현합니다.
      mesh.rotation.z += 0.01;

      effect.render(scene, camera);
    }

    animate();

    // 7. 창 크기 변경 대응
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      effect.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
